<style>
:root{--bg:#E9E6E1;--card:#F4F1EC;--ink:#1B2338;--mut:#4A4F5C;--cta:#E07B56}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif}

h1{margin:0;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:44px;line-height:1.1}
.tag{margin:0;font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:24px;color:var(--mut)}
p{margin:0;font-size:18px;line-height:1.55}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:10px;background:var(--cta);color:var(--ink);font-weight:700;font-size:18px;text-decoration:none}
footer{padding:20px 16px;text-align:center;font-size:14px;color:var(--mut)}
footer a{color:var(--mut)}
</style>
</head>
<body>
<main>
<div class="box">
<h1>Abbi Cura di Te Stesso</h1>

<p>Spunti pratici, letture e incontri per capire da dove nasce il rimuginare e ritrovare la calma nella vita di tutti i giorni.</p>

</div>
</main>
<footer>
